name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: cloude-browser-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release olarak yayınla (telefondan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cloude-browser.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cloude-browser.apk \
            --title "Cloude Browser (son sürüm)" \
            --notes "Otomatik derlenen debug APK. Telefondan indirip kurabilirsin."
